<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Live Stream</title>
  
  <!-- Shaka Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #141419;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f7d070 0%, #d4af37 50%, #aa771c 100%);
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Player Container */
    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.12);
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    /* Action Card */
    .action-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .share-btn {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .share-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .divider {
      margin: 22px 0;
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
    }

    /* Social Community Section */
    .social-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s;
    }

    .social-link:hover {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      transform: translateY(-2px);
    }

    .social-link.telegram i { color: #229ED9; font-size: 1.2rem; }
    .social-link.whatsapp i { color: #25D366; font-size: 1.2rem; }
    .social-link.instagram i { color: #E1306C; font-size: 1.2rem; }

    /* Force Join Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-box {
      background: #141419;
      border: 1.5px solid var(--gold-primary);
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }

    .modal-box i.lock-icon {
      font-size: 2.8rem;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }

    .modal-box h2 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: #fff;
    }

    .modal-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-tg-join {
      background: var(--gold-gradient);
      color: #000;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-unlock {
      margin-top: 12px;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-unlock:hover {
      background: rgba(212, 175, 55, 0.08);
    }
  </style>
</head>
<body>

  <!-- Force Join Lock Popup -->
  <div class="modal-overlay" id="verifyModal">
    <div class="modal-box">
      <i class="fa-solid fa-lock lock-icon"></i>
      <h2>VERIFY YOURSELF FIRST</h2>
      <p>Stream dekhne ke liye hamara official Telegram channel join karein aur stream unlock karein.</p>
      
      <a href="https://t.me/+tirUqNl9KsswNTI1" target="_blank" class="btn-tg-join" id="tgJoinBtn">
        <i class="fa-brands fa-telegram"></i> JOIN TELEGRAM TO WATCH
      </a>
      
      <button class="btn-unlock" id="unlockBtn" style="display: none;">
        Maine Join Kar Liya (Watch Now)
      </button>
    </div>
  </div>

  <div class="container">
    <!-- Shaka Video Player -->
    <div class="player-wrapper">
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- Actions & Social Links -->
    <div class="action-card">
      <button class="share-btn" onclick="shareStream()">
        <i class="fa-solid fa-share-nodes"></i> SHARE THE STREAM
      </button>

      <hr class="divider" />

      <div class="social-title">Official Communities</div>
      <div class="social-grid">
        <a href="https://t.me/+tirUqNl9KsswNTI1" target="_blank" class="social-link telegram">
          <i class="fa-brands fa-telegram"></i> Telegram Channel
        </a>
        <a href="https://whatsapp.com/channel/0029Vb8iP65JkK71WiJ0Eg2V" target="_blank" class="social-link whatsapp">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Channel
        </a>
        <a href="https://www.instagram.com/rarexvault.og?dlrf=MWZuZ3gxemhybWJhaQ==" target="_blank" class="social-link instagram">
          <i class="fa-brands fa-instagram"></i> Instagram Page
        </a>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const modal = document.getElementById('verifyModal');
    const tgBtn = document.getElementById('tgJoinBtn');
    const unlockBtn = document.getElementById('unlockBtn');
    let playerInstance = null;

    // 1. Shaka Player Initializer
    async function initPlayer() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        alert('Aapka browser MPD stream support nahi karta.');
        return;
      }

      playerInstance = new shaka.Player(video);

      // Error handler
      playerInstance.addEventListener('error', (event) => {
        console.error('Player Error Code:', event.detail.code, event.detail);
      });
    }

    async function playStream(url) {
      if (!playerInstance) await initPlayer();
      try {
        await playerInstance.load(url);
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      } catch (e) {
        console.error('Load Error:', e);
      }
    }

    // 2. Telegram Force Join Workflow
    tgBtn.addEventListener('click', () => {
      // User jaise hi Telegram button dabata hai, unlock button appear hoga
      setTimeout(() => {
        unlockBtn.style.display = 'block';
      }, 1000);
    });

    unlockBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      loadCurrentStream();
    });

    function loadCurrentStream() {
      const params = new URLSearchParams(window.location.search);
      // Agar ?mpd= ya ?url= parameter ho to wahi uthao, warna fallback test stream
      const streamUrl = params.get('mpd') || params.get('url') || 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
      playStream(streamUrl);
    }

    // 3. Share The Stream Function
    function shareStream() {
      if (navigator.share) {
        navigator.share({
          title: 'Watch Live Stream',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Stream Link copied to clipboard!');
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
